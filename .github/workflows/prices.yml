name: 更新美股／日股報價

on:
  schedule:
    # ── 美股收盤後更新：台北 06:00 ──
    # UTC 22:00 = 台北 06:00。0-5 = UTC 週日～週五，對應台北 週一～週六 早上
    # （台北週六早上那班負責抓美股週五收盤）
    - cron: "0 22 * * 0-5"
    # GitHub 排程是「盡力而為」，實測常延遲 2～4 小時；以下兩班是備援
    # UTC 23:00 / 00:00 = 台北 07:00 / 08:00
    - cron: "0 23 * * 0-5"
    - cron: "0 0 * * 1-6"
    # ── 盤後即時更新：當日日股收盤後 ──
    # UTC 07:00 = 台北 15:00（週一～週五下午）
    - cron: "0 7 * * 1-5"
  workflow_dispatch: {}   # 允許在 Actions 分頁手動按「Run workflow」

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取報價
        run: python3 scripts/fetch_prices.py

      - name: 提交更新
        run: |
          git config user.name "price-bot"
          git config user.email "actions@github.com"
          git add prices.json
          git diff --cached --quiet && echo "無變更" || git commit -m "prices: $(date -u +'%Y-%m-%d %H:%M') UTC 自動更新"
          git push
