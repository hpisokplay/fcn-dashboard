name: 更新美股／日股報價

on:
  schedule:
    # GitHub 排程是「盡力而為」，整點（:00）最塞、延遲最長，所以全部避開整點。
    # ── 美股收盤後更新（美股 20:00 UTC 收盤）──
    # 1-5 = UTC 週一～週五 = 美股交易日當晚；台北時間是隔天早上
    # UTC 20:47 / 21:23 / 21:53 / 22:37 / 23:13 = 台北 04:47 / 05:23 / 05:53 / 06:37 / 07:13
    - cron: "47 20 * * 1-5"
    - cron: "23 21 * * 1-5"
    - cron: "53 21 * * 1-5"
    - cron: "37 22 * * 1-5"
    - cron: "13 23 * * 1-5"
    # ── 日股收盤後更新（日股 06:30 UTC 收盤）──
    # UTC 06:47 / 08:17 = 台北 14:47 / 16:17（週一～週五）
    - cron: "47 6 * * 1-5"
    - cron: "17 8 * * 1-5"
  workflow_dispatch: {}   # 允許在 Actions 分頁手動按「Run workflow」

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取報價
        run: python3 scripts/fetch_prices.py

      - name: 提交更新
        run: |
          git config user.name "price-bot"
          git config user.email "actions@github.com"
          git add prices.json
          git diff --cached --quiet && echo "無變更" || git commit -m "prices: $(date -u +'%Y-%m-%d %H:%M') UTC 自動更新"
          git push
